.rv{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*.12s)}.rv.in{opacity:1;transform:none}
.am{position:fixed;inset:0;z-index:90;background:#0b1b4a99;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .25s}.am.out{animation:fadeo .2s forwards}
.amc{position:relative;background:var(--card);border-radius:18px;padding:28px;width:100%;max-width:420px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px #0006;animation:pop .35s cubic-bezier(.2,1.2,.4,1)}.amx{position:absolute;top:12px;right:12px;border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--mut)}
.amh{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:22px;font-weight:700;color:var(--tx)}.amh img{width:44px;height:44px;border-radius:50%}.amh span{color:var(--pri)}
@media(max-width:800px){.lp-links{display:none}.lp-hin{grid-template-columns:1fr;padding-top:26px}.lp-hero img{margin-top:10px}.lp-cards,.lp-fg{grid-template-columns:1fr}.lp-steps{grid-template-columns:1fr}.lp-ar{display:none}.lp-fi{border:0;padding:6px 0}.lp-logo{font-size:19px}.lp-logo img{width:42px;height:42px}}
.cs .wrap{max-width:none;padding:0;margin:0}.cs .lp-nav{animation:none}.cs.intro .lp-nav{animation:down .5s both}.cs .np{top:80px}
.cs-r{margin-left:auto;display:flex;gap:10px;align-items:center}.cs-u{font-weight:500;color:var(--tx)}.cs .lp-hin{min-height:300px}
@media(max-width:800px){.cs .lp-in{flex-wrap:wrap;height:auto;padding:10px 16px;gap:8px}.cs .lp-links{display:flex;order:3;width:100%;margin:0;gap:20px;overflow-x:auto}.cs .lp-links a{padding:8px 0;white-space:nowrap}.cs-u{display:none}}
.toast{position:fixed;left:50%;bottom:24px;background:#17285a;color:#fff;padding:10px 20px;border-radius:99px;z-index:50;animation:tin .3s both;transition:opacity .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:800px){.side{position:fixed;left:-250px;z-index:15;transition:.2s}.side.open{left:0}.burger{display:block}.two{grid-template-columns:1fr}.wrap{padding:12px}}

 const u=S.user,un=D.notifs.filter(n=>n.userId==u.id&&!n.read);
 const nav=MENU[u.role].map(m=>`<button class="nav ${S.page==m[0]||(S.page=='detail'&&m[0]=='list')?'on':''}" data-p="${m[0]}" onclick="go('${m[0]}')"><span>${m[1]}</span>${m[2]}</button>`).join('');
 root.innerHTML=u.role=='customer'?custShell(u,un):`<div class="app ${S.intro?'intro':''}"><aside class="side ${S.menu?'open':''}"><i class="navind"></i><h2><img src="${LOGO}" alt="PICC"><span style="color:#fff">Fix</span><span>IT</span> <em>picc</em></h2>${nav}<button class="nav" onclick="logout()" style="margin-top:20px"><span>⏻</span>ออกจากระบบ</button></aside>
<div class="main"><div class="top"><button class="btn g s burger" onclick="S.menu=!S.menu;draw()">☰ เมนู</button><b>${RL[u.role]}</b><span class="sp"></span>
<button class="btn g s" onclick="S.dark=!S.dark;document.documentElement.dataset.theme=S.dark?'dark':'light'">◐</button>
<button class="btn g s ${un.length?'ring':''}" onclick="S.np=!S.np;draw()">🔔 ${un.length||''}</button><span class="hint">${esc(u.name)}</span></div>
${S.np?`<div class="card np"><h3>การแจ้งเตือน</h3>${D.notifs.filter(n=>n.userId==u.id).slice(0,6).map(n=>`<p style="margin:6px 0;${n.read?'color:var(--mut)':''}">${esc(n.text)}<br><small class="hint">${fd(n.at)}</small></p>`).join('')||'<p class="hint">ไม่มีการแจ้งเตือน</p>'}<button class="btn g s" onclick="D.notifs.forEach(n=>n.userId==S.user.id&&(n.read=true));DB.save();S.np=false;draw()">อ่านทั้งหมดแล้ว</button></div>`:''}
<div class="wrap ${S.anim?'enter':''}">${page()}</div></div></div>${S.modal||''}`;
 if(S.anim)document.querySelectorAll('.stat b').forEach(b=>{const n=+b.textContent;if(!(n>0))return;let i=0;const t=setInterval(()=>{i++;b.textContent=Math.round(n*i/20);if(i>=20)clearInterval(t)},25)});moveInd(false);S.anim=false;S.intro=false}
function stepsHTML(){return `<h2 class="lp-t">ขั้นตอนการใช้บริการ</h2><div class="lp-steps"><div class="lp-st"><div class="lp-sn"><i>1</i><em>📝</em></div><b>กรอกข้อมูลและอาการเสีย</b><span>ระบุรายละเอียดอุปกรณ์ และอาการที่พบ</span></div><div class="lp-ar">➜</div><div class="lp-st"><div class="lp-sn"><i>2</i><em>🎫</em></div><b>รับเลขที่งานซ่อม</b><span>เมื่อส่งข้อมูลสำเร็จ จะได้รับเลขที่งานซ่อม</span></div><div class="lp-ar">➜</div><div class="lp-st"><div class="lp-sn"><i>3</i><em>✅</em></div><b>ติดตามผลซ่อม</b><span>ตรวจสอบสถานะได้ผ่านระบบ</span></div></div>`}
function custHome(){const u=S.user,L=mine(),c=a=>L.filter(r=>a.includes(r.status)).length;
 return `<div class="lp-hero"><div class="lp-hin"><div><h1 class="lp-h">สวัสดี คุณ${esc(u.name)}<span>แจ้งซ่อมได้ง่ายในไม่กี่ขั้นตอน</span></h1><p class="lp-p">ระบบรับแจ้งปัญหาและติดตามสถานะงานซ่อม<br>สำหรับวิทยาลัยการอาชีพปราจีนบุรี PICC</p><div class="lp-bt"><button class="btn" onclick="go('new')">＋ แจ้งซ่อมอุปกรณ์</button><button class="btn out" onclick="go('list')">🔍 ติดตามสถานะงาน</button></div></div><img src="${HERO}" alt=""></div></div>
<div class="lp-w" style="padding-bottom:30px"><div class="grid" style="margin-top:26px">${stat('งานซ่อมทั้งหมด',L.length)}${stat('รอดำเนินการ',c(['new','accepted']))}${stat('กำลังซ่อม',c(['checking','repairing','waiting_parts']))}${stat('ซ่อมเสร็จแล้ว',c(['done','returned']))}</div>
<div class="card"><h3>งานล่าสุดของคุณ</h3>${tbl(L.slice().reverse().slice(0,5))}</div>${stepsHTML()}</div>`}
function custFoot(){const C=CONTACT;return `<div class="lp-ft"><div class="lp-w lp-fg"><div class="lp-fi"><i>📞</i><div><b>ติดต่อหน่วยงาน IT</b><span>โทร. ${C.tel}<br></span></div></div><div class="lp-fi"><i>🕒</i><div><b>เวลาทำการ</b><span>${C.hours}<br>${C.off}</span></div></div><div class="lp-fi"><i>📍</i><div><b>วิทยาลัย PICC</b><span>${C.addr}<br>${C.addr2}</span></div></div></div></div>`}
function custShell(u,un){const M=[['dash','หน้าแรก'],['new','แจ้งซ่อมใหม่'],['list','ติดตามงาน'],['profile','ข้อมูลส่วนตัว']],act=p=>S.page==p||(S.page=='detail'&&p=='list');
 return `<div class="lp cs ${S.intro?'intro':''}"><div class="lp-nav"><div class="lp-in"><div class="lp-logo" onclick="go('dash')" style="cursor:pointer"><img src="${LOGO}" alt="PICC"><div>Fix <span>IT</span> - PICC</div></div>
<div class="lp-links">${M.map(m=>`<a data-p="${m[0]}" class="${act(m[0])?'on':''}" onclick="go('${m[0]}')">${m[1]}</a>`).join('')}</div>
<div class="cs-r"><button class="btn g s ${un.length?'ring':''}" onclick="S.np=!S.np;draw()">🔔 ${un.length||''}</button><span class="cs-u">${esc(u.name)}</span><button class="btn g s" onclick="logout()">ออกจากระบบ</button></div></div>
${S.np?`<div class="card np"><h3>การแจ้งเตือน</h3>${D.notifs.filter(n=>n.userId==u.id).slice(0,6).map(n=>`<p style="margin:6px 0;${n.read?'color:var(--mut)':''}">${esc(n.text)}<br><small class="hint">${fd(n.at)}</small></p>`).join('')||'<p class="hint">ไม่มีการแจ้งเตือน</p>'}<button class="btn g s" onclick="D.notifs.forEach(n=>n.userId==S.user.id&&(n.read=true));DB.save();S.np=false;draw()">อ่านทั้งหมดแล้ว</button></div>`:''}</div>
<div class="wrap ${S.anim?'enter':''}">${page()}</div>${custFoot()}</div>`}
function page(){if(S.user.role!='customer')return pageRaw();if(S.page=='dash')return custHome();return `<div class="lp-w" style="padding-top:26px;padding-bottom:40px">${pageRaw()}</div>`}
function pageRaw(){const p=S.page,r=S.user.role;
 if(p=='dash')return r=='admin'?adminDash():dash();if(p=='new')return newForm();if(p=='list')return list();if(p=='detail')return detail();
 if(p=='profile')return profile();if(p=='users')return users();if(p=='report')return report();if(p=='schema')return schema();return''}
/* ===== Dashboards ===== */
function stat(a,b,c){return `<div class="stat"><small>${a}</small><b>${b}</b></div>`}
function dash(){const L=mine(),c=s=>L.filter(r=>s.includes(r.status)).length,cu=S.user.role=='customer';
 return `<h1>สวัสดี ${esc(S.user.name)}</h1>${cu?`<button class="btn" onclick="go('new')" style="margin-bottom:16px;padding:12px 24px;font-size:16px">＋ แจ้งซ่อมใหม่</button>`:''}
<div class="grid">${stat('งานทั้งหมด',L.length)}${stat(cu?'รอดำเนินการ':'งานใหม่',c(['new','accepted']))}${stat('กำลังซ่อม',c(['checking','repairing']))}${stat('รออะไหล่',c(['waiting_parts']))}${stat('ซ่อมเสร็จแล้ว',c(['done','returned']))}</div>
<div class="card"><h3>งานล่าสุด</h3>${tbl(L.slice().reverse().slice(0,5))}</div>`}
function monthly(f){const m={};D.repairs.forEach(r=>{const k=r.createdAt.slice(0,7);m[k]=(m[k]||0)+f(r)});return Object.entries(m).sort()}
function barsV(e){const mx=Math.max(1,...e.map(x=>x[1]));return `<div class="bars">${e.map(x=>`<div><i style="height:${x[1]/mx*100}px"></i>${x[1]}<br>${x[0].slice(5)}</div>`).join('')}</div>`}
function hbar(e){const mx=Math.max(1,...e.map(x=>x[1]));return e.map(x=>`<div class="hb"><span>${x[0]}</span><i style="width:${x[1]/mx*55}%"></i>${x[1]}</div>`).join('')}
function cnt(f){const m={};D.repairs.forEach(r=>{const k=f(r);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function adminDash(){const R=D.repairs,c=s=>R.filter(r=>s.includes(r.status)).length,rev=R.filter(r=>['done','returned'].includes(r.status)).reduce((a,r)=>a+cost(r),0);
 return `<h1>ภาพรวมระบบ</h1><div class="grid">${stat('งานทั้งหมด',R.length)}${stat('งานใหม่',c(['new']))}${stat('กำลังซ่อม',c(['accepted','checking','repairing']))}${stat('รออะไหล่',c(['waiting_parts']))}${stat('ซ่อมเสร็จ',c(['done','returned']))}${stat('ยกเลิก',c(['cancelled']))}${stat('รายได้รวม',money(rev))}</div>
<div class="two"><div class="card"><h3>งานซ่อมรายเดือน</h3>${barsV(monthly(()=>1))}</div><div class="card"><h3>รายได้รายเดือน (บาท)</h3>${barsV(monthly(r=>['done','returned'].includes(r.status)?cost(r):0))}</div>
<div class="card"><h3>ประเภทอุปกรณ์ที่เสียบ่อย</h3>${hbar(cnt(r=>r.type))}</div><div class="card"><h3>สถานะงานซ่อม</h3>${hbar(cnt(r=>ST[r.status][0]))}</div></div>`}
/* ===== List / table ===== */
function tbl(L,adm){return `<div class="tw"><table><tr><th>เลขที่งาน</th><th>ลูกค้า</th><th>อุปกรณ์</th><th>อาการเสีย</th><th>ช่าง</th><th>วันที่แจ้ง</th><th>สถานะ</th><th>ค่าใช้จ่าย</th><th></th></tr>
${L.map(r=>`<tr><td><b>${r.no}</b></td><td>${esc(r.name)}</td><td>${esc(r.brand)} ${esc(r.model)}</td><td>${esc(r.symptom)}</td>
<td>${adm?`<select onchange="assign(${r.id},this.value)" style="min-width:130px"><option value="">— เลือกช่าง —</option>${techs().map(t=>`<option value="${t.id}" ${t.id==r.techId?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`:esc(uname(r.techId))}</td>
<td>${fd(r.createdAt)}</td><td>${bdg(r.status)}</td><td>${money(cost(r))}</td><td><button class="btn g s" onclick="go('detail',${r.id})">ดู${adm?'/แก้ไข':''}</button></td></tr>`).join('')||'<tr><td colspan=9 class="hint">ไม่พบข้อมูล</td></tr>'}</table></div>`}
function assign(id,t){const r=D.repairs.find(x=>x.id==id);r.techId=t?+t:null;if(t){if(r.status=='new')setStatus(r,'accepted','Admin มอบหมายงานให้ '+uname(r.techId));notify(+t,'คุณได้รับมอบหมายงาน '+r.no)}DB.save();draw();toast('✔ มอบหมายช่างแล้ว')}
function list(){let L=mine().slice().reverse(),q=S.q.toLowerCase();
 if(q)L=L.filter(r=>(r.no+r.name+r.brand+r.model+r.symptom).toLowerCase().includes(q));if(S.f)L=L.filter(r=>r.status==S.f);if(S.t)L=L.filter(r=>r.techId==S.t);if(S.d)L=L.filter(r=>r.createdAt.slice(0,10)==S.d);
 const n=Math.max(1,Math.ceil(L.length/6));S.pg=Math.min(S.pg,n);const adm=S.user.role=='admin';
 return `<h1>${adm?'จัดการใบแจ้งซ่อม':'รายการงานซ่อม'}</h1><div class="card"><div class="bar"><input placeholder="ค้นหา เลขที่งาน / ลูกค้า / อาการ" value="${esc(S.q)}" oninput="S.q=this.value;S.pg=1;keep(this)">
<select onchange="S.f=this.value;S.pg=1;draw()"><option value="">ทุกสถานะ</option>${Object.keys(ST).map(k=>`<option value="${k}" ${S.f==k?'selected':''}>${ST[k][0]}</option>`).join('')}</select>
${adm?`<select onchange="S.t=this.value;S.pg=1;draw()"><option value="">ทุกช่าง</option>${techs().map(t=>`<option value="${t.id}" ${S.t==t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`:''}
<input type="date" value="${S.d}" onchange="S.d=this.value;S.pg=1;draw()"></div>${tbl(L.slice((S.pg-1)*6,S.pg*6),adm)}
<div class="pg"><button class="btn g s" ${S.pg<2?'disabled':''} onclick="S.pg--;draw()">‹</button>หน้า ${S.pg}/${n} (${L.length} งาน)<button class="btn g s" ${S.pg>=n?'disabled':''} onclick="S.pg++;draw()">›</button></div></div>`}
function keep(el){const p=el.selectionStart;draw();const i=document.querySelector('.bar input');i.focus();i.setSelectionRange(p,p)}
/* ===== New repair ===== */
let TMP=[];
function readImgs(inp,cb){[...inp.files].forEach(f=>{if(f.size>400000)return alert(f.name+' ใหญ่เกิน 400KB');const fr=new FileReader();fr.onload=()=>cb(fr.result);fr.readAsDataURL(f)})}
function newForm(){const u=S.user;return `<h1>แจ้งซ่อมใหม่</h1><div class="card"><div class="f2"><div><label>ชื่อผู้แจ้ง</label><input id="n1" value="${esc(u.name)}"></div><div><label>เบอร์โทรศัพท์</label><input id="n2" value="${esc(u.phone)}"></div>
<div><label>ประเภทอุปกรณ์</label><select id="n3">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div><label>ยี่ห้อ</label><input id="n4"></div><div><label>รุ่น</label><input id="n5"></div><div><label>Serial Number</label><input id="n6"></div></div>
<label>อาการเสีย *</label><input id="n7"><label>รายละเอียดเพิ่มเติม</label><textarea id="n8" rows="3"></textarea>
<label>อัปโหลดรูปภาพ (ไม่เกิน 400KB ต่อรูป)</label><input type="file" accept="image/*" multiple onchange="TMP=[];readImgs(this,d=>{TMP.push(d);$('pv').innerHTML+='<img src='+d+'>'})"><div class="imgs" id="pv" style="margin-top:8px"></div>
<label>วันที่ต้องการนำเครื่องเข้าซ่อม</label><input id="n9" type="date"><br><button class="btn" onclick="submitNew()">ส่งใบแจ้งซ่อม</button></div>`}
function setStatus(r,s,note){r.status=s;r.history.push({status:s,at:new Date().toISOString().slice(0,16),note:note||''})}
function submitNew(){if(!v('n7').trim()||!v('n4').trim())return alert('กรอกยี่ห้อและอาการเสีย');const id=D.seq.r++,no='JOB-2026-'+String(id).padStart(4,'0');
 const r={id,no,customerId:S.user.id,techId:null,name:v('n1'),phone:v('n2'),type:v('n3'),brand:v('n4'),model:v('n5'),serial:v('n6'),symptom:v('n7'),detail:v('n8'),images:TMP,before:[],after:[],date:v('n9'),createdAt:new Date().toISOString().slice(0,16),status:'new',diagnosis:'',cause:'',fix:'',parts:[],labor:0,note:'',history:[]};
 setStatus(r,'new','ลูกค้าส่งใบแจ้งซ่อม');D.repairs.push(r);D.users.filter(x=>x.role=='admin').forEach(a=>notify(a.id,'มีงานใหม่ '+no+' รอมอบหมายช่าง'));TMP=[];DB.save();go('detail',id);toast('✔ สร้างใบแจ้งซ่อมแล้ว: '+no);confetti()}
/* ===== Detail ===== */
function imgs(a){return a.length?`<div class="imgs">${a.map(s=>`<img src="${s}">`).join('')}</div>`:'<span class="hint">ไม่มีรูป</span>'}
function detail(){const r=D.repairs.find(x=>x.id==S.id);if(!r)return'ไม่พบงาน';const role=S.user.role,edit=role!='customer';
 const tl=r.history.map(h=>`<div><b>${ST[h.status][0]}</b><br><small>${fd(h.at)}</small><br>${esc(h.note)}</div>`).join('');
 return `<button class="btn g s" onclick="go('list')">‹ กลับ</button><h1 style="margin-top:12px">${r.no} ${bdg(r.status)}</h1>
${prog(r)}<div class="two"><div><div class="card"><h3>ข้อมูลอุปกรณ์</h3><p>ผู้แจ้ง: ${esc(r.name)} (${esc(r.phone)})<br>อุปกรณ์: ${esc(r.type)} ${esc(r.brand)} ${esc(r.model)}<br>Serial: ${esc(r.serial)||'-'}<br>อาการเสีย: ${esc(r.symptom)}<br>รายละเอียด: ${esc(r.detail)||'-'}<br>วันที่นำเข้าซ่อม: ${fd(r.date)}<br>ช่างผู้รับผิดชอบ: ${esc(uname(r.techId))}</p>${imgs(r.images)}</div>
<div class="card"><h3>ผลการซ่อมและค่าใช้จ่าย</h3><p>อาการที่ตรวจพบ: ${esc(r.diagnosis)||'-'}<br>สาเหตุ: ${esc(r.cause)||'-'}<br>วิธีแก้ไข: ${esc(r.fix)||'-'}<br>หมายเหตุ: ${esc(r.note)||'-'}</p>
<table>${r.parts.map(p=>`<tr><td>${esc(p.name)}</td><td align=right>${money(p.price)}</td></tr>`).join('')}<tr><td>ค่าแรง</td><td align=right>${money(r.labor)}</td></tr><tr><td><b>รวม</b></td><td align=right><b>${money(cost(r))}</b></td></tr></table>
<h3 style="margin-top:12px">ก่อนซ่อม</h3>${imgs(r.before)}<h3 style="margin-top:12px">หลังซ่อม</h3>${imgs(r.after)}</div></div>
<div><div class="card"><h3>Timeline การซ่อม</h3><div class="tl">${tl}</div></div>${edit?editPanel(r,role):''}</div></div>`}
function editPanel(r,role){const ok=role=='admin'||r.techId==S.user.id;if(!ok)return'';
 return `<div class="card"><h3>บันทึกงานซ่อม</h3><label>สถานะ</label><select id="e1">${Object.keys(ST).map(k=>`<option value="${k}" ${r.status==k?'selected':''}>${ST[k][0]}</option>`).join('')}</select>
<label>หมายเหตุสถานะ (แสดงใน Timeline)</label><input id="e2"><label>อาการที่ตรวจพบ</label><input id="e3" value="${esc(r.diagnosis)}"><label>สาเหตุของปัญหา</label><input id="e4" value="${esc(r.cause)}"><label>วิธีแก้ไข</label><input id="e5" value="${esc(r.fix)}">
<label>ค่าแรง (บาท)</label><input id="e6" type="number" value="${r.labor}"><label>หมายเหตุ</label><input id="e7" value="${esc(r.note)}">
<label>เพิ่มอะไหล่ที่เปลี่ยน</label><div class="bar"><input id="p1" placeholder="ชื่ออะไหล่"><input id="p2" type="number" placeholder="ราคา"><button class="btn g" style="flex:0" onclick="addPart(${r.id})">เพิ่ม</button></div>
<label>รูปก่อนซ่อม</label><input type="file" accept="image/*" multiple onchange="readImgs(this,d=>addImg(${r.id},'before',d))"><label>รูปหลังซ่อม</label><input type="file" accept="image/*" multiple onchange="readImgs(this,d=>addImg(${r.id},'after',d))"><br>
<div class="bar"><button class="btn" onclick="saveJob(${r.id})">บันทึก</button>${role=='technician'&&r.status!='done'&&r.status!='returned'?`<button class="btn g" onclick="saveJob(${r.id},'done')">ปิดงาน (ซ่อมเสร็จ)</button>`:''}${role=='admin'?`<button class="btn r" onclick="delJob(${r.id})">ลบงาน</button>`:''}</div></div>`}
function addPart(id){const r=D.repairs.find(x=>x.id==id);if(!v('p1'))return;r.parts.push({name:v('p1'),price:+v('p2')||0});DB.save();draw();toast('✔ เพิ่มอะไหล่แล้ว')}
function addImg(id,k,d){D.repairs.find(x=>x.id==id)[k].push(d);DB.save();draw()}
function saveJob(id,force){const r=D.repairs.find(x=>x.id==id),s=force||v('e1');r.diagnosis=v('e3');r.cause=v('e4');r.fix=v('e5');r.labor=+v('e6')||0;r.note=v('e7');
 if(s!=r.status){setStatus(r,s,v('e2'));if(s=='done')setTimeout(confetti,300);notify(r.customerId,`งาน ${r.no} เปลี่ยนสถานะเป็น "${ST[s][0]}"`)}DB.save();draw();toast('✔ บันทึกงานแล้ว')}
function delJob(id){if(confirm('ลบงานนี้?')){D.repairs=D.repairs.filter(r=>r.id!=id);DB.save();go('list');toast('ลบงานแล้ว')}}
/* ===== Users / profile ===== */
function users(){let L=D.users,q=S.q.toLowerCase();if(q)L=L.filter(u=>(u.name+u.email).toLowerCase().includes(q));if(S.f)L=L.filter(u=>u.role==S.f);
 return `<h1>จัดการผู้ใช้งาน</h1><div class="card"><div class="bar"><input placeholder="ค้นหาชื่อ/อีเมล" value="${esc(S.q)}" oninput="S.q=this.value;keep(this)"><select onchange="S.f=this.value;draw()"><option value="">ทุก Role</option>${Object.keys(RL).map(k=>`<option value="${k}" ${S.f==k?'selected':''}>${k}</option>`).join('')}</select><button class="btn" style="flex:0;white-space:nowrap" onclick="userModal()">＋ เพิ่มผู้ใช้</button></div>
<div class="tw"><table><tr><th>ชื่อ</th><th>อีเมล</th><th>โทร</th><th>Role</th><th>สถานะ</th><th></th></tr>${L.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td><span class="bd">${u.role}</span></td><td><span class="bd ${u.active?'ok':'x'}">${u.active?'ใช้งาน':'ปิด'}</span></td>
<td><button class="btn g s" onclick="userModal(${u.id})">แก้ไข</button> <button class="btn g s" onclick="toggleU(${u.id})">เปิด/ปิด</button> <button class="btn r s" onclick="delU(${u.id})">ลบ</button></td></tr>`).join('')}</table></div></div>`}
function userModal(id){const u=D.users.find(x=>x.id==id)||{name:'',email:'',phone:'',role:'customer',password:''};
 S.modal=`<div class="modal"><div class="card"><h3>${id?'แก้ไข':'เพิ่ม'}ผู้ใช้</h3><label>ชื่อ</label><input id="m1" value="${esc(u.name)}"><label>อีเมล</label><input id="m2" value="${esc(u.email)}"><label>โทร</label><input id="m3" value="${esc(u.phone)}">
<label>Role</label><select id="m4">${Object.keys(RL).map(k=>`<option ${u.role==k?'selected':''}>${k}</option>`).join('')}</select><label>รหัสผ่าน</label><input id="m5" value="${esc(u.password)}"><br>
<div class="bar"><button class="btn" onclick="saveU(${id||0})">บันทึก</button><button class="btn g" onclick="S.modal=null;draw()">ยกเลิก</button></div></div></div>`;draw()}
function saveU(id){const o={name:v('m1'),email:v('m2'),phone:v('m3'),role:v('m4'),password:v('m5')};if(!o.name||!o.email||!o.password)return alert('กรอกข้อมูลให้ครบ');const u0=o.email.toLowerCase().split('@')[0];if(D.users.some(x=>x.id!=id&&String(x.email).toLowerCase().split('@')[0]==u0))return alert('ชื่อผู้ใช้ "'+u0+'" ถูกใช้แล้ว');
 if(id)Object.assign(D.users.find(x=>x.id==id),o);else D.users.push({id:D.seq.u++,active:true,...o});S.modal=null;DB.save();draw();toast('✔ บันทึกผู้ใช้แล้ว')}
function toggleU(id){const u=D.users.find(x=>x.id==id);if(u.id==S.user.id)return alert('ปิดบัญชีตัวเองไม่ได้');u.active=!u.active;DB.save();draw();toast(u.active?'✔ เปิดบัญชีแล้ว':'ปิดบัญชีแล้ว')}
function delU(id){if(id==S.user.id)return alert('ลบบัญชีตัวเองไม่ได้');if(D.repairs.some(r=>r.customerId==id||r.techId==id))return alert('ผู้ใช้นี้มีงานซ่อมที่เกี่ยวข้อง ลบไม่ได้ (ให้ปิดบัญชีแทน)');if(confirm('ลบผู้ใช้?')){D.users=D.users.filter(u=>u.id!=id);DB.save();draw();toast('ลบผู้ใช้แล้ว')}}
function profile(){const u=S.user;return `<h1>ข้อมูลส่วนตัว</h1><div class="card" style="max-width:500px"><label>ชื่อ</label><input id="f1" value="${esc(u.name)}"><label>เบอร์โทร</label><input id="f2" value="${esc(u.phone)}"><label>อีเมล</label><input value="${esc(u.email)}" disabled><label>รหัสผ่านใหม่ (เว้นว่างถ้าไม่เปลี่ยน)</label><input id="f3" type="password"><br><button class="btn" onclick="S.user.name=v('f1');S.user.phone=v('f2');if(v('f3'))S.user.password=v('f3');DB.save();draw();toast('✔ บันทึกข้อมูลแล้ว')">บันทึก</button></div>`}
/* ===== Report / schema ===== */
function report(){const R=D.repairs.filter(r=>['done','returned'].includes(r.status));const by={};R.forEach(r=>{const k=r.techId;by[k]=by[k]||[0,0];by[k][0]++;by[k][1]+=cost(r)});
 return `<h1>รายงาน/สถิติการซ่อม</h1><div class="card"><h3>สรุปผลงานรายช่าง</h3><div class="tw"><table><tr><th>ช่าง</th><th>งานที่เสร็จ</th><th>รายได้</th></tr>${Object.entries(by).map(([k,x])=>`<tr><td>${esc(uname(k))}</td><td>${x[0]}</td><td>${money(x[1])}</td></tr>`).join('')}</table></div></div>
<div class="card"><h3>ยี่ห้อที่เข้าซ่อมบ่อย</h3>${hbar(cnt(r=>r.brand).slice(0,6))}</div><button class="btn" onclick="csv()">⬇ ส่งออก CSV</button> <button class="btn g" onclick="window.print()">พิมพ์</button> <button class="btn r" onclick="if(confirm('รีเซ็ตข้อมูลเดโม?')){DB.reset();draw()}">รีเซ็ตข้อมูลเดโม</button>`}
function csv(){const t='เลขที่งาน,ลูกค้า,อุปกรณ์,สถานะ,ค่าใช้จ่าย\n'+D.repairs.map(r=>[r.no,r.name,r.brand+' '+r.model,ST[r.status][0],cost(r)].join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='fixit-report.csv';a.click()}
function schema(){return `<h1>โครงสร้างฐานข้อมูล (SQL)</h1><div class="card"><p class="hint">ออกแบบไว้สำหรับ MySQL/PostgreSQL — ฟังก์ชันใน DB layer (DB.load / DB.save) เปลี่ยนเป็น fetch('/api/...') ได้ทันที</p><pre>users(id PK, name, email UNIQUE, password_hash, phone, role ENUM('admin','technician','customer'), is_active, created_at)
customers(id PK, user_id FK→users.id, address)
technicians(id PK, user_id FK→users.id, skill, is_available)
repairs(id PK, job_no UNIQUE, customer_id FK→customers.id, technician_id FK→technicians.id NULL,
  device_type, brand, model, serial_no, symptom, detail, desired_date, status,
  diagnosis, cause, solution, labor_cost, note, created_at, updated_at)
repair_images(id PK, repair_id FK→repairs.id, url, kind ENUM('report','before','after'))
repair_history(id PK, repair_id FK→repairs.id, status, note, changed_by FK→users.id, created_at)
parts(id PK, name, unit_price, stock)
repair_parts(id PK, repair_id FK→repairs.id, part_id FK→parts.id, qty, unit_price)
notifications(id PK, user_id FK→users.id, message, is_read, created_at)</pre></div>`}
$('root').innerHTML='<div class="auth"><div class="card" style="text-align:center"><div class="spin"></div>โปรดรอสักครู่... </div></div>';
DB.pull().then(()=>{restore();draw();DB.startLive()}).catch(e=>{alert('เชื่อมต่อ Google Sheet ไม่ได้: '+e.message+'\nระบบจะใช้ข้อมูลเดโมชั่วคราว');draw()});
</script></body></html>
